[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mfie"
version = "0.1.0"
description = "Macro-Informed Financial Intelligence Engine — Forex & Crypto analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "SQLAlchemy>=2.0",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "requests>=2.31",
    "rich>=13.0",
    "typer>=0.9",
    "streamlit>=1.50",
    "plotly>=5.18",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
telegram = ["python-telegram-bot>=21.0"]
nlp = ["transformers>=4.38", "torch>=2.2"]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.3"]

[project.scripts]
mfie = "mfie.cli:main"

[tool.setuptools.packages.find]
include = ["mfie*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::FutureWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
