# MFIE — local and small-deployment stack.
#
#   docker compose up -d          # SQLite, zero setup
#   docker compose --profile postgres up -d   # with TimescaleDB
#
# The Postgres service is behind a profile because the default SQLite path
# needs no database at all, and starting one people did not ask for is the
# kind of surprise that makes a compose file untrustworthy.

services:
  mfie:
    build: .
    image: mfie:latest
    restart: unless-stopped
    ports:
      - "${MFIE_BIND:-127.0.0.1}:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      MFIE_HOST: 0.0.0.0
      MFIE_PORT: 8000
      # Point at Timescale when the postgres profile is running.
      # DATABASE_URL: postgresql+psycopg2://mfie:mfie@timescale:5432/mfie
    volumes:
      # Keeps the SQLite database, ingested history and realised trades across
      # restarts. Losing this resets hit-rate calibration to its prior.
      - mfie-data:/app/data
      # Thresholds are read at startup; edit and restart to apply.
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # The engine is CPU-bound in pandas during a scan; without a ceiling it
    # will happily saturate every core on the host.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  timescale:
    profiles: ["postgres"]
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mfie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mfie}
      POSTGRES_DB: mfie
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mfie"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mfie-data:
  timescale-data:
