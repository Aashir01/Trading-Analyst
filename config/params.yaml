# Econometric parameters — the behaviour of the engine lives here.
#
# These are NOT secrets; they belong in version control so that a change in
# behaviour shows up in a diff. Every value overrides the dataclass default in
# mfie/config.py. Anything you omit keeps its default.
#
# Treat these as hypotheses to be backtested, not as truths. Run
#   python -m mfie backtest EURUSD --compare
# after changing a threshold to see whether the filter is earning its keep.

liquidity:
  # ΔGLI = w1 * %change(M2) + w2 * %change(stablecoin supply)
  m2_weight: 0.6                 # fiat leg — dominant for forex
  stablecoin_weight: 0.4         # crypto-native leg
  lookback_days: 90              # n in the formula
  contraction_threshold: 0.0     # ΔGLI below this => contraction regime
  contraction_penalty: 0.5       # multiplier on momentum longs at full severity
  strong_expansion_threshold: 0.02

yields:
  inversion_threshold: 0.0       # 10Y-2Y <= 0 => CONTRACTION
  steepening_threshold: 0.005
  contraction_penalty: 0.6
  block_high_beta_on_inversion: true   # hard block on altcoin / carry-currency longs

rird:
  # Real Interest Rate Differential: (I_A - pi_A) - (I_B - pi_B)
  significant_differential: 0.01       # 100 bps before it means anything
  aligned_bonus: 1.15
  opposed_penalty: 0.65
  hard_block_differential: 0.03        # 300 bps against the trade => block

ppp:
  lookback_periods: 250          # REER observations for the z-score
  overvalued_z: 2.0
  stretched_z: 1.5
  penalty: 0.5
  block_breakouts_beyond_z: 2.5

esi:
  decay_lambda: 0.05             # e^{-lambda * days}; ~14-day half-life
  window_days: 90
  significant_delta: 1.0
  aligned_bonus: 1.10
  opposed_penalty: 0.80

tokenomics:
  velocity_lookback: 90
  velocity_z_warning: -1.5       # V below mean - 1.5 sigma => hoarding
  nvt_lookback: 90
  nvt_z_overvalued: 2.0
  divergence_penalty: 0.55
  nvt_penalty: 0.7

microstructure:
  atr_period: 14
  friction_warn: 0.10            # LF = spread / ATR
  friction_halt: 0.30
  widen_stops: true
  max_stop_multiplier: 2.5

behavioral:
  contrarian_k: 2.0              # exponent in C_t = 1 - |(%long - 0.5)/0.5|^k
  extreme_threshold: 0.85
  fear_greed_extreme_greed: 80.0
  fear_greed_extreme_fear: 20.0
  fear_greed_penalty: 0.75

events:
  blackout_minutes_before: 30
  blackout_minutes_after: 30
  medium_impact_penalty: 0.8

risk:
  account_equity: 10000.0
  base_risk_per_trade: 0.01      # 1% of equity at the stop
  max_risk_per_trade: 0.02
  max_portfolio_risk: 0.06       # total heat across open positions
  cvar_alpha: 0.95
  cvar_lookback: 250
  cvar_budget: 0.035             # daily CVaR95 budget, as a fraction of equity
  cvar_breach_scaler: 0.5
  # Portfolio-level annualised volatility target. Applied per position, so a
  # 65%-vol crypto pair is sized far smaller than a 9%-vol FX pair. Raise this
  # if you run a crypto-only book and the sizes come out too small.
  target_annual_vol: 0.15
  kelly_fraction_cap: 0.25       # quarter-Kelly ceiling
  min_confidence_to_trade: 0.35
  atr_stop_multiple: 2.0
  reward_risk_target: 2.0

# ---------------------------------------------------------------------------
# The capital allocation layer (mfie/portfolio).
#
# Three questions the filter chain cannot answer, because each needs to see
# more than one trade at a time — or needs to see the account rather than the
# chart: what does the round trip cost, what hit rate has this setup actually
# earned, and how much of this book is secretly the same bet.
# ---------------------------------------------------------------------------
costs:
  # Costs are converted to R (multiples of the stop distance) before anything
  # uses them. A cost in basis points cannot be compared to a 2R target; the
  # same 4 bps is noise on a wide stop and fatal on a tight one.
  commission_bps_per_side: 4.0
  slippage_atr_fraction: 0.05     # fraction of ATR conceded per side
  min_spread_bps: 1.0             # floor when no top-of-book is available
  funding_interval_hours: 8.0     # perpetual funding cadence
  max_holding_bars: 400.0         # cap on the diffusion holding-time estimate
  apply_carry: true               # signed: a paid carry widens the edge

calibration:
  # Beta-Binomial credibility. kappa is an equivalent sample size: at 40, a
  # strategy needs 40 realised trades before its own record outweighs the
  # prior. Lower it only if you have a lot of history and trust it.
  prior_strength: 40.0
  prior_base: 0.35                # p0 = base + slope * confidence, the old guess
  prior_slope: 0.25
  prior_floor: 0.20
  prior_ceiling: 0.75
  sizing_quantile: 0.25           # size on the posterior's lower tail, not its mean
  min_cell_observations: 10       # thinner cells inherit their parent's estimate
  reliability_buckets: 5

portfolio:
  enabled: true
  min_expected_r: 0.05            # net of costs — below this, do not trade
  cluster_threshold: 0.55         # above this correlation, one bet
  correlation_lookback: 250
  min_correlation_observations: 60
  default_correlation: 0.35       # unknown correlation is positive, not zero
  redundancy_decay: 1.0           # k-th idea in a cluster keeps 1/(1 + k*decay)
  max_cluster_risk: 0.03          # per-cluster share of equity at risk
  # Budget on sqrt(w' C w), not on the sum. It may safely exceed
  # risk.max_portfolio_risk because correlated risk is never larger than
  # additive risk — that is the whole point of measuring it.
  max_effective_risk: 0.045
  max_positions: 12

technical:
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bb_period: 20
  bb_std: 2.0
  atr_period: 14
  adx_period: 14
  ema_fast: 20
  ema_slow: 50
  ema_trend: 200
  donchian_period: 20
  zscore_period: 20

# ---------------------------------------------------------------------------
# Market Cycle Compass (mfie/alpha) — the leading bull/bear engine.
#
# This block is the closest thing here to proprietary IP. The formulas are
# public; these weights, lead windows and thresholds, calibrated on YOUR data,
# are not. If secrecy matters, keep this file out of a public repository.
# ---------------------------------------------------------------------------
cycle:
  history_days: 720
  zscore_window: 365
  smoothing_days: 5
  impulse_window: 63          # ~3 months — the derivative window
  real_rate_window: 126       # ~6 months — policy works with a long lag
  breadth_ma: 50

  # Economic priors. Renormalised to sum to 1. These are the fallback whenever
  # the data cannot justify a different weighting — which, on a short history,
  # is most of the time, and correctly so.
  prior_weights:
    liquidity_impulse: 0.26   # acceleration of money — the longest lead
    credit_regime: 0.20       # curve shape AND direction
    real_rate_impulse: 0.16   # direction of the real policy rate
    breadth: 0.14             # participation
    valuation: 0.10           # slow anchor, poor timing tool
    risk_appetite: 0.08       # contrarian positioning
    trend_confirmation: 0.06  # lagging confirmer, deliberately small

  # Lead-lag search
  max_lead_days: 120
  lead_step_days: 10
  forward_horizon: 63         # the return window each factor is scored against
  min_observations: 250
  align_leads: true           # make all factors speak to one forecast horizon
  min_tstat: 2.0              # below this, trust the prior instead
  max_weight_multiple: 2.0    # a measured weight may not run away from its prior
  min_weight_multiple: 0.4

  # State machine. Asymmetric on purpose: bull markets die slowly, bears start
  # fast, so leaving a bull needs a lower bar than entering one.
  bull_entry: 0.25
  bull_exit: -0.05
  bear_entry: -0.25
  bear_exit: 0.10
  confirm_days: 5             # a new phase must persist before it is accepted

  divergence_window: 63
  divergence_threshold: 1.0   # standard deviations of price/macro disagreement
  hazard_horizon: 63

regime:
  vol_lookback: 60
  trend_lookback: 60
  high_vol_percentile: 0.75
  low_vol_percentile: 0.35
  adx_trending: 25.0
  hmm_states: 3
